<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RÆDIUS</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center}.loading{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.55}</style></head><body><div class="loading">Entering RÆDIUS…</div><script type="module">const files=[0,1,2,3,4,5].map(i=>`payload-${i}.txt`);try{const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(`Failed ${f}`);return r.text()}));const b=parts.join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const s=new TextDecoder().decode(await new Response(stream).arrayBuffer());document.open();document.write(s);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;white-space:pre-wrap">'+e.message+'</pre>'}</script></body></html>
